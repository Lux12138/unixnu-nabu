"owned_memory_size" = "0x130000000"
"root_match_volume_uuid" = "04769D26-2CA0-4825-B443-E2E5F88300F2"
"cpu_regs" = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
"packed_data_ramdisk" = true
"unique_chip_id" = "required"
# l563: BACK TO true. l561 made this false; the board then measured `disk4: device is not ready` 47 times
# (l561) and 51 times (l562r) where every persistent round had 0, and l562r died at 154.8 s with nswap=0.
# An ephemeral Data volume leaves APFS disk4s1 unmounted, so the system fails mass reads. Upstream can use a
# RAM seed because its DarwinBoot builds the volume; we boot the kernel directly, so the seed is not rebuilt.
"persistent_data" = true


["adt"."chosen"."u32"]
"no-effaceable-storage" = 1
"display-scale" = 2
"embedded-panic-log-size" = "0x80000"

# l749: panic region 0x9b000000/0x80000 (nabu.dts panic_region), before GOP 0x9c000000.
# reg = two little-endian u64: phys=0x9b000000, size=0x80000.
["adt"."pram"."bytes"]
"reg" = "000000009b0000000000000000080000"

